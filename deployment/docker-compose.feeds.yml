version: '3.8'

services:
  nginx-feeds:
    image: nginx:latest
    container_name: narro-feeds-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Nginx configuration
      - ./nginx/feeds.conf:/etc/nginx/conf.d/default.conf:ro

      # SSL certificates (managed by certbot)
      - ./nginx/ssl/feeds.narro.info:/etc/nginx/ssl/feeds.narro.info:ro

      # Nginx cache directory
      - nginx-cache:/var/cache/nginx

      # Nginx logs
      - ./logs/nginx:/var/log/nginx

    networks:
      - narro-network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  certbot:
    image: certbot/certbot:latest
    container_name: narro-certbot
    restart: unless-stopped
    volumes:
      - ./nginx/ssl:/etc/letsencrypt
      - ./nginx/certbot:/var/www/certbot
    entrypoint: >
      sh -c "while true; do
        certbot renew --webroot -w /var/www/certbot -q;
        sleep 86400;
      done"
    depends_on:
      - nginx-feeds
    networks:
      - narro-network

volumes:
  nginx-cache:
    driver: local

networks:
  narro-network:
    driver: bridge
