upstream supabase_functions {
    server kldhpsgmbtfzmollexod.supabase.co:443;
}

server {
    listen 80;
    server_name feeds.narro.info;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name feeds.narro.info;

    # SSL certificates (will be managed by Let's Encrypt via Docker)
    ssl_certificate /etc/nginx/ssl/feeds.narro.info/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/feeds.narro.info/key.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Gzip compression
    gzip on;
    gzip_types application/rss+xml application/xml text/xml;
    gzip_min_length 1000;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # RSS feed proxy
    location ~ ^/(.+)\.rss$ {
        # Extract feed ID from URL parameter
        set $feed_id $1;

        # Proxy to Supabase Edge Function
        proxy_pass https://supabase_functions/functions/v1/rss-feed/$feed_id.rss;

        # Add authorization header with Supabase anon key
        proxy_set_header Authorization "Bearer sb_publishable_0n0Zfl0ePcvyBHsx99hhPQ_XRH-lJ8v";

        # Pass through important headers
        proxy_set_header Host "kldhpsgmbtfzmollexod.supabase.co";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for streaming
        proxy_buffering off;

        # SSL verification
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_session_reuse on;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Cache RSS feeds for 15 minutes (matching Edge Function)
        proxy_cache_valid 200 15m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

        # Add cache status header for debugging
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Deny all other requests
    location / {
        return 404;
    }
}
